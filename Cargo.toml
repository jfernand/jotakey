[workspace]
resolver = "3"
members = [
    "crates/jotakey-core",
    "crates/jotakey-bridge",
    "crates/jotakey-host-tests",
    "crates/jotakey-explorer",
]
# Firmware crates target riscv32imac-unknown-none-elf and the fuzz crate needs nightly +
# libFuzzer; they are built from their own directories, as is the example web app.
exclude = ["crates/jotakey-fw", "crates/jotakey-testfw", "fuzz", "examples/webauthn-topcoat"]

[workspace.package]
edition = "2024"
version = "0.1.0"
authors = ["Javier Fernandez @ JotaSoft"]
publish = false

[profile.dev]
overflow-checks = true

[profile.release]
overflow-checks = true
debug = true
