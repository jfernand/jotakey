# cargo-deny policy for the firmware (separate workspace). Same rules as ../../deny.toml,
# plus documented exceptions for build-time-only crates.
# cargo-deny policy (https://embarkstudios.github.io/cargo-deny/). Run: `cargo deny check`.

[graph]
all-features = true

[advisories]
# RustSec advisories are errors; a yanked crate is an error too.
yanked = "deny"
ignore = [
    # `paste` is a proc-macro used by esp-hal at compile time; no code ships in the image.
    { id = "RUSTSEC-2024-0436", reason = "compile-time proc-macro only (esp-hal)" },
    # `unsafe-libyaml` is pulled in by esp-config's *build script* (host side) to read
    # YAML configuration; it never runs on the device.
    { id = "RUSTSEC-2024-0449", reason = "host build-script dependency only (esp-config)" },
    # crypto-bigint 0.5 timing variability. The FIDO crypto (jotakey-core) is on p256 0.14 and
    # crypto-bigint 0.7; only trouble-host's BLE LESC pairing still uses p256 0.13, and no
    # trouble-host release has moved yet (0.8.0 included). Its key is fresh for every pairing
    # (no bonding), and CTAP protects what the link carries. Remove this entry when a
    # trouble-host release depends on p256 0.14: https://github.com/embassy-rs/trouble/issues/724
    { id = "RUSTSEC-2026-0387", reason = "trouble-host BLE pairing only; FIDO crypto uses p256 0.14" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
]
confidence-threshold = 0.9

# Our own crates are `publish = false`; their license is the owner's decision.
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The workspace crates are path dependencies without versions.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
