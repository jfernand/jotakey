[package]
name = "jotakey-bridge"
description = "Linux bridge: Jotakey serial CTAPHID tunnel <-> virtual FIDO HID device (uhid)"
edition.workspace = true
version.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
jotakey-core = { path = "../jotakey-core" }
serialport = { version = "4", default-features = false }
# Already in the tree through serialport (same version and feature): poll(2) on two fds.
nix = { version = "0.26", default-features = false, features = ["poll"] }
