[build]
target = "thumbv7em-none-eabihf"

[target.thumbv7em-none-eabihf]
# Flash over SWD and show the defmt log (RTT). The USB port carries only CTAPHID.
runner = "probe-rs run --chip STM32L432KCUx"
rustflags = ["-C", "link-arg=--nmagic", "-C", "link-arg=-Tlink.x", "-C", "link-arg=-Tdefmt.x"]

[env]
DEFMT_LOG = "info"
