# cargo-deny policy (https://embarkstudios.github.io/cargo-deny/). Run: `cargo deny check`.

[graph]
all-features = true

[advisories]
# RustSec advisories are errors; a yanked crate is an error too.
yanked = "deny"
ignore = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
]
confidence-threshold = 0.9

# Our own crates are `publish = false`; their license is the owner's decision.
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The workspace crates are path dependencies without versions.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
