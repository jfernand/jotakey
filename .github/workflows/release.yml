# (c) Javier Fernandez @ JotaSoft 2026
# On every release tag (hardware hw-vX.Y.Z, firmware fw-vX.Y.Z): build both versions of the
# design report, keep them as workflow artifacts, and attach them to the tag's GitHub release
# (creating the release if it does not exist yet).
name: release

on:
  push:
    tags: ["hw-v*", "fw-v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  TYPST_VERSION: "0.15.1"

jobs:
  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Typst
        run: |
          curl -sSfL "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz" \
            | tar -xJ --strip-components=1 -C /usr/local/bin typst-x86_64-unknown-linux-musl/typst
          typst --version

      - name: Build the report (screen and print)
        run: |
          mkdir -p out
          typst compile --font-path docs/fonts --ignore-system-fonts \
            docs/jotakey.typ out/jotakey.pdf
          typst compile --font-path docs/fonts --ignore-system-fonts --input print=true \
            docs/jotakey.typ out/jotakey-print.pdf

      - uses: actions/upload-artifact@v4
        with:
          name: jotakey-docs-${{ github.ref_name }}
          path: out/*.pdf

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --verify-tag --title "$TAG" --notes "Release $TAG."
          gh release upload "$TAG" out/jotakey.pdf out/jotakey-print.pdf --clobber
